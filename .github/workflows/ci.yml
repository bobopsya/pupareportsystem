name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end (Playwright)
        run: |
          npx playwright install --with-deps chromium
          export DATA_DIR="$RUNNER_TEMP/data" DB_KEY=$(openssl rand -hex 32) FILES_KEY=$(openssl rand -hex 32) \
                 COOKIE_SECURE=0 WEB_DIST="$PWD/web/dist" HOST=127.0.0.1 PORT=8080
          ADMIN_PASSWORD=$(node server/dist/cli.js create-user admin "CI Admin" | sed -n 's/.*Временный пароль: //p')
          node server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          ADMIN_PASSWORD="$ADMIN_PASSWORD" npx playwright test

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  gpay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: |
          npm ci
          npm ci --prefix gpay/server
          npm ci --prefix gpay/web

      - name: Typecheck
        run: npm --prefix gpay/server run typecheck && npm --prefix gpay/web run typecheck

      - name: Unit & API tests
        run: npm --prefix gpay/server test && npm --prefix gpay/web test

      - name: Build
        run: npm --prefix gpay/web run build && npm --prefix gpay/server run build

      # GPAY accepts only Bobobank money, so its end-to-end tests run in the bobobank job with both servers.

  bobobank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: |
          npm ci
          npm ci --prefix bobobank/server
          npm ci --prefix bobobank/web
          npm ci --prefix gpay/server
          npm ci --prefix gpay/web

      - name: Typecheck
        run: npm --prefix bobobank/server run typecheck && npm --prefix bobobank/web run typecheck

      - name: Unit & API tests
        run: npm --prefix bobobank/server test && npm --prefix bobobank/web test

      - name: Build
        run: |
          npm --prefix bobobank/web run build && npm --prefix bobobank/server run build
          npm --prefix gpay/web run build && npm --prefix gpay/server run build

      - name: End-to-end, Bobobank and GPAY (Playwright)
        run: |
          npx playwright install --with-deps chromium
          SECRET=$(openssl rand -hex 32)
          DATA_DIR="$RUNNER_TEMP/gpay" COOKIE_SECURE=0 WEB_DIST="$PWD/gpay/web/dist" HOST=127.0.0.1 PORT=8081 PUBLIC_URL=http://localhost:8081 \
            BANK_INTERNAL_URL=http://127.0.0.1:8082 BANK_PUBLIC_URL=http://localhost:8082 BANK_GPAY_SECRET=$SECRET \
            node gpay/server/dist/index.js > "$RUNNER_TEMP/gpay.log" 2>&1 &
          DATA_DIR="$RUNNER_TEMP/bank" COOKIE_SECURE=0 WEB_DIST="$PWD/bobobank/web/dist" HOST=127.0.0.1 PORT=8082 PUBLIC_URL=http://localhost:8082 \
            GPAY_INTERNAL_URL=http://127.0.0.1:8081 GPAY_PUBLIC_URL=http://localhost:8081 BANK_GPAY_SECRET=$SECRET \
            node bobobank/server/dist/index.js > "$RUNNER_TEMP/bank.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8082/api/health && curl -fs http://127.0.0.1:8081/api/health && break; sleep 1; done
          PW=$(DATA_DIR="$RUNNER_TEMP/bank" node bobobank/server/dist/cli.js create-admin 79990000001 "Админ" | awk '/Пароль/ {print $2}')
          export BANK_ADMIN_PHONE=79990000001 BANK_ADMIN_PASSWORD=$PW
          npx playwright test -c bobobank/playwright.config.ts
          BASE_URL=http://localhost:8081 BANK_URL=http://localhost:8082 npx playwright test -c gpay/playwright.config.ts

      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP/bank.log" "$RUNNER_TEMP/gpay.log" || true

  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: |
          npm ci
          npm ci --prefix transport/server
          npm ci --prefix transport/web
          npm ci --prefix bobobank/server
          npm ci --prefix bobobank/web

      - name: Typecheck
        run: npm --prefix transport/server run typecheck && npm --prefix transport/web run typecheck

      - name: Unit & API tests
        run: npm --prefix transport/server test

      - name: Build
        run: |
          npm --prefix transport/web run build && npm --prefix transport/server run build
          npm --prefix bobobank/web run build && npm --prefix bobobank/server run build

      # OSRM and Nominatim are replaced by a local fixture, map tiles are stubbed in the test: CI does not call OSM servers.
      - name: End-to-end, Бобо.Транспорт with Bobobank (Playwright)
        run: |
          npx playwright install --with-deps chromium
          SECRET=$(openssl rand -hex 32)
          node transport/e2e/fake-osm.mjs 8099 > "$RUNNER_TEMP/osm.log" 2>&1 &
          DATA_DIR="$RUNNER_TEMP/bank" COOKIE_SECURE=0 WEB_DIST="$PWD/bobobank/web/dist" HOST=127.0.0.1 PORT=8082 PUBLIC_URL=http://localhost:8082 \
            TRANSPORT_PUBLIC_URL=http://localhost:8084 BANK_TRANSPORT_SECRET=$SECRET \
            node bobobank/server/dist/index.js > "$RUNNER_TEMP/bank.log" 2>&1 &
          DATA_DIR="$RUNNER_TEMP/taxi" COOKIE_SECURE=0 WEB_DIST="$PWD/transport/web/dist" HOST=127.0.0.1 PORT=8084 PUBLIC_URL=http://localhost:8084 \
            BANK_INTERNAL_URL=http://127.0.0.1:8082 BANK_PUBLIC_URL=http://localhost:8082 BANK_TRANSPORT_SECRET=$SECRET \
            OSRM_URL=http://127.0.0.1:8099 NOMINATIM_URL=http://127.0.0.1:8099 BUS_ROUTES_FILE="$PWD/transport/e2e/bus-fixture.json" TIME_SCALE=6 AIR_TIME_SCALE=30 \
            node transport/server/dist/index.js > "$RUNNER_TEMP/taxi.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8082/api/health && curl -fs http://127.0.0.1:8084/api/health && break; sleep 1; done
          PW=$(DATA_DIR="$RUNNER_TEMP/bank" node bobobank/server/dist/cli.js create-admin 79990000001 "Админ" | awk '/Пароль/ {print $2}')
          BANK_ADMIN_PHONE=79990000001 BANK_ADMIN_PASSWORD=$PW npx playwright test -c transport/playwright.config.ts

      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP/taxi.log" "$RUNNER_TEMP/bank.log" "$RUNNER_TEMP/osm.log" || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zhukonet-portal:ci .
      - name: Build GPAY image
        run: docker build -t gpay:ci gpay
      - name: Build Bobobank image
        run: docker build -t bobobank:ci bobobank
      - name: Build Бобо.Транспорт image
        run: docker build -t bobo-transport:ci transport
