# ZhukoNet portal.
#   Caddy mode (ports 80/443 free):   COMPOSE_PROFILES=caddy in .env
#   Behind existing nginx:            leave COMPOSE_PROFILES empty, nginx proxies to 127.0.0.1:${APP_PORT}
#   GPAY payment system:              add "gpay" to COMPOSE_PROFILES (deploy/install-gpay.sh does it)
#   Bobobank (game bank):             add "bobobank" to COMPOSE_PROFILES (deploy/install-bobobank.sh does it)
#   Бобуслуги (state services site):  add "bobuslugi" to COMPOSE_PROFILES (deploy/install-bobuslugi.sh clones it and does it)
#   Бобо.Транспорт (game taxi):       add "transport" to COMPOSE_PROFILES (deploy/install-transport.sh does it)
services:
  app:
    build: .
    image: zhukonet-portal:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  gpay:
    build: ./gpay
    image: gpay:latest
    profiles: ["gpay"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_URL: https://${GPAY_DOMAIN:-pay.localhost}
      GPAY_DB_KEY: ${GPAY_DB_KEY:-}
      # Bobobank connection (set by deploy/install-bobobank.sh); empty = GPAY works without the bank.
      BANK_INTERNAL_URL: ${BANK_INTERNAL_URL:-}
      BANK_PUBLIC_URL: ${BANK_PUBLIC_URL:-}
      BANK_GPAY_SECRET: ${BANK_GPAY_SECRET:-}
      # Бобуслуги (set by deploy/install-bobuslugi.sh); empty = no «Войти через Бобуслуги».
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      GOS_PUBLIC_URL: ${GOS_PUBLIC_URL:-}
    volumes:
      - ./gpay-data:/data
    ports:
      - "127.0.0.1:${GPAY_PORT:-8081}:8081"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bobobank:
    build: ./bobobank
    image: bobobank:latest
    profiles: ["bobobank"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_URL: https://${BANK_DOMAIN:-bank.localhost}
      BANK_DB_KEY: ${BANK_DB_KEY:-}
      GPAY_INTERNAL_URL: http://gpay:8081
      GPAY_PUBLIC_URL: https://${GPAY_DOMAIN:-pay.localhost}
      BANK_GPAY_SECRET: ${BANK_GPAY_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      GOS_PUBLIC_URL: ${GOS_PUBLIC_URL:-}
      # Бобо.Транспорт (set by deploy/install-transport.sh); empty = «Войти через Bobobank» is off for the taxi.
      TRANSPORT_PUBLIC_URL: ${TRANSPORT_PUBLIC_URL:-}
      BANK_TRANSPORT_SECRET: ${BANK_TRANSPORT_SECRET:-}
    volumes:
      - ./bobobank-data:/data
    ports:
      - "127.0.0.1:${BANK_PORT:-8082}:8082"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Бобуслуги: static site (the repository is cloned into ./bobuslugi), the database stays in Supabase.
  bobuslugi:
    build:
      context: ./bobuslugi
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        VITE_EMAIL_DOMAIN: ${GOS_EMAIL_DOMAIN:-bobuslugi.local}
        VITE_BANK_URL: https://${BANK_DOMAIN:-bank.localhost}
        VITE_GPAY_URL: https://${GPAY_DOMAIN:-pay.localhost}
    image: bobuslugi:latest
    profiles: ["bobuslugi"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOS_PORT:-8083}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Бобо.Транспорт: taxi game, pays through Bobobank, routes from OSRM and addresses from Nominatim.
  transport:
    build: ./transport
    image: bobo-transport:latest
    profiles: ["transport"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_URL: https://${TAXI_DOMAIN:-taxi.localhost}
      TRANSPORT_DB_KEY: ${TRANSPORT_DB_KEY:-}
      BANK_INTERNAL_URL: http://bobobank:8082
      BANK_PUBLIC_URL: https://${BANK_DOMAIN:-bank.localhost}
      BANK_TRANSPORT_SECRET: ${BANK_TRANSPORT_SECRET:-}
      # Public OSM servers by default; point to your own OSRM / Nominatim if you run them.
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
    volumes:
      - ./transport-data:/data
    ports:
      - "127.0.0.1:${TAXI_PORT:-8084}:8084"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
      GPAY_DOMAIN: ${GPAY_DOMAIN:-pay.localhost}
      BANK_DOMAIN: ${BANK_DOMAIN:-bank.localhost}
      GOS_DOMAIN: ${GOS_DOMAIN:-gos.localhost}
      TAXI_DOMAIN: ${TAXI_DOMAIN:-taxi.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
